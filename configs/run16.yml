# ─────────────────────────────────────────────────────────────────────────────
# run16 — SWC-type loss weighting + PSF-aware z-initialisation
#
# Changes vs run15:
#   + soma_loss_scale     = 0.3  : loss weight for soma region (< 1)
#                                  downweights the easily-fit bright soma so
#                                  gradient budget flows to dim dendrites
#   + dendrite_loss_scale = 1.5  : loss weight for dendritic region (> 1)
#                                  upweights fine processes that carry most
#                                  morphological information
#   + soma_weight_radius  = 0.15 : soma extent in normalised [-1,1]^3 coords
#                                  linear ramp: full soma weight at 0, full
#                                  dendrite weight at soma_weight_radius
#   + init_scale_z_factor = 3.0  : PSF-aware z init — confocal axial resolution
#                                  is ~3x worse than lateral, so seed Gaussians
#                                  elongated along z to match the acquisition PSF
#                                  rather than waiting for the optimiser to learn it
#
# All other parameters identical to run15.
# ─────────────────────────────────────────────────────────────────────────────

# ── I/O ───────────────────────────────────────────────────────────────────────
volume:   data/10-2900-control-cell-05.oif-C0.v3dpbd.tif
swc_path: data/10-2900-control-cell-05.oif-C0.v3dpbd.swc
out:      logs/3dgs/run16
device:   cuda

# ── Model ─────────────────────────────────────────────────────────────────────
n_init:          20000
max_gaussians:   150000
init_scale:      0.05
init_inten:      0.1

# ── Training schedule ─────────────────────────────────────────────────────────
epochs:          2000
steps_per_epoch: 50
batch:           4096
chunk_n:         1024

# ── Sampling ──────────────────────────────────────────────────────────────────
swc_init:            true
swc_oriented_init:   true
grad_sample_weight:  0.4

# ── Interior initialisation (soma fill) ───────────────────────────────────────
interior_init_n:      5000
interior_init_thresh: 0.30

# ── SWC-type spatial loss weighting ───────────────────────────────────────────
soma_loss_scale:      0.3    # weight applied to voxels at the soma centre
dendrite_loss_scale:  1.5    # weight applied to voxels far from soma
soma_weight_radius:   0.15   # ramp radius in [-1,1]^3 (≈ soma diameter)

# ── Perceptual loss ────────────────────────────────────────────────────────────
log_intensity_loss:   true

# ── PSF-aware z-axis initialisation ───────────────────────────────────────────
# Confocal axial PSF ~3× wider than lateral → seed Gaussians elongated along z.
# The optimiser can then shrink z-scale where the data is isotropic rather than
# growing it from an isotropic init (faster convergence for thin z-sections).
init_scale_z_factor:  3.0

# ── Numerical stability ────────────────────────────────────────────────────────
scale_min_clamp: 1.0e-5
mahal_max_clamp: 20.0
grad_clip_norm:  1.0

# ── Learning rates ─────────────────────────────────────────────────────────────
lr_means:          1.6e-4
lr_means_final:    1.6e-6
lr_scales:         5.0e-3
lr_quats:          1.0e-3
lr_inten:          1.0e-2
lr_final_fraction: 0.01
adam_eps:          1.0e-15

# ── Regularisation ─────────────────────────────────────────────────────────────
lambda_scale:         5.0e-5
lambda_sparsity:      8.0e-3
lambda_scale_ceiling: 1.0e-3
lambda_scale_outlier: 5.0e-4
scale_max_hard:       0.50
scale_min_hard:       0.008
lambda_aniso:         4.0e-4
lambda_count:         5.0e-4
lambda_L1:            3.0e-4
lambda_coverage:      1.0e-4
prune_inten_thresh:   3.0e-3

# ── Edge sharpness loss ────────────────────────────────────────────────────────
lambda_grad:          0.05

# ── GaussianPile-inspired slice loss ──────────────────────────────────────────
lambda_ssim:          0.2
ssim_crop:            64
ssim_start_step:      20000

# ── Adaptive density control ───────────────────────────────────────────────────
densify_from_step:      500
densify_until_step:     50000
densify_interval:       200
densify_grad_thresh:    2.0e-4
densify_max_scale:      0.03
split_scale_divisor:    1.6
log_scale_floor:        -6.0

# ── Evaluation / logging ───────────────────────────────────────────────────────
eval_samples:         200000
eval_detail_interval: 5
log_interval:         10
ckpt_interval:        2000
